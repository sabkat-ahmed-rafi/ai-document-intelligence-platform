<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password</title>
  </head>
  <body style="margin: 0; background-color: #f4f7fb; color: #172033; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f7fb; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; background-color: #ffffff; border-radius: 12px; padding: 40px;">
            <tr>
              <td>
                <h1 style="margin: 0 0 20px; font-size: 28px; line-height: 1.25;">Reset your password</h1>
                <p style="margin: 0 0 16px; line-height: 1.6;">Hi $recipient_name,</p>
                <p style="margin: 0 0 24px; line-height: 1.6;">We received a request to reset your password. Enter this verification code to continue:</p>
                <p style="margin: 0 0 24px; border-radius: 8px; background-color: #f0f4ff; color: #172033; font-size: 32px; font-weight: 700; letter-spacing: 8px; padding: 18px; text-align: center;">$reset_code</p>
                <p style="margin: 0; color: #5e687d; font-size: 14px; line-height: 1.6;">This code expires in $expires_in_minutes minutes. If you did not request a password reset, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
